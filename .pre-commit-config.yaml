# off-the-shelf hooks instead of hand-rolled ci checks. ci runs
# `pre-commit run --all-files`, so a skipped local install still gets caught
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [ --fix ]
  # uv.lock matches pyproject
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.4
    hooks:
      - id: uv-lock

[project]
name = "paper-trail"
version = "0.1.0"
description = "From policy text to implementation evidence — tracking Józsefváros climate measures."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2",
    "ddgs>=9.16.0",
    "fastapi>=0.115.0",
    "fastembed>=0.8.0",
    "httpx-retries>=0.6.0",
    "huggingface-hub>=1.32.0",
    "numpy>=2.5.3",
    "py-rust-stemmers>=0.1.8",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.10.0",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "trafilatura>=2.2.0",
    "uvicorn>=0.30.0",
    "openai>=3.32.0",
    "rank-bm25>=0.2.2",
    "asgi-correlation-id>=5.0.1",
    "tenacity>=9",
    "typer>=0.16",
]

[project.optional-dependencies]
parsing = ["docling>=2"]
hungarian = ["spacy>=3.8,<3.9"]
# PAPER_TRAIL_NER=gliner, multilingual ner on cpu
ner = ["gliner>=0.2"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_trail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# B008: fastapi's Depends() in defaults is the idiom. E741: `l` for link reads fine here
ignore = ["B008", "E741"]

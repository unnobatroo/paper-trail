[project]
name = "paper-trail"
version = "0.1.0"
description = "From policy text to implementation evidence — tracking Józsefváros climate measures."
requires-python = ">=3.13"
dependencies = [
    "ddgs>=9.16.0",
    "fastembed>=0.8.0",
    "pydantic>=2.13.5",
    "pypdf>=6.19.0",
    "requests>=2.34.2",
    "streamlit>=1.64.0",
    "trafilatura>=2.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
ml = [
    "scikit-learn>=1.6.0",
    "sentence-transformers>=3.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper_trail"]

[tool.pytest.ini_options]
testpaths = ["tests"]

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync --no-group ml

      - name: Lint
        run: uv run ruff check src tests scripts

      # azure's zip deploy installs from requirements.txt, so it has to match uv.lock
      - name: requirements.txt matches uv.lock
        run: diff <(uv export --format requirements-txt --no-hashes --no-dev --no-group ml --frozen -q | grep -v '^#') <(grep -v '^#' requirements.txt)

      - name: Test
        # the whole suite is offline by design — no secrets needed
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

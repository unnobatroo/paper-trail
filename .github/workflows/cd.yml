name: CD

# Deploys the API to Azure App Service when backend code lands on main.
# The frontend deploys itself — Vercel watches the repo — and
# vercel-alias.yml re-points the public domain afterwards.
# Needs an AZURE_CREDENTIALS secret: a service principal with
# contributor on the paper-trail resource group.

on:
  push:
    branches: [main]
    paths:
      - src/**
      - requirements.txt
      - Dockerfile
      - pyproject.toml
      - uv.lock
      - .github/workflows/cd.yml

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Package and deploy
        run: |
          git archive --format=zip -o deploy.zip HEAD
          az webapp deploy \
            --resource-group paper-trail \
            --name paper-trail-api \
            --src-path deploy.zip --type zip --async true

      - name: Wait for a healthy API
        run: |
          for i in $(seq 1 30); do
            sleep 15
            if curl -sf https://paper-trail-api.azurewebsites.net/healthz; then
              exit 0
            fi
          done
          echo "API did not come up healthy"; exit 1

      - name: Sign out
        if: always()
        run: az logout

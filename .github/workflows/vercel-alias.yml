name: Re-alias production domain

# paper-trail.vercel.app is claimed as a deployment alias (another team
# holds the project-domain record), so it doesn't follow new deploys on
# its own. This workflow re-points it after every successful production
# deployment. Requires a VERCEL secret holding a Vercel access token
# scoped to the mashincar team (vercel.com/account/tokens).

on:
  deployment_status:

jobs:
  alias:
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'
    runs-on: ubuntu-latest
    steps:
      - name: Point paper-trail.vercel.app at the new deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL }}
          PROJECT_ID: prj_lqNrgCmKlUzo4p4snhNSYNSU17Lc
          TEAM_ID: team_92HtIdnyTnVtduxORyV3Vq3K
        run: |
          DEPLOY_URL=$(curl -sf \
            "https://api.vercel.com/v6/deployments?projectId=${PROJECT_ID}&teamId=${TEAM_ID}&target=production&state=READY&limit=1" \
            -H "Authorization: Bearer ${VERCEL_TOKEN}" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['deployments'][0]['url'])")
          npm install -g vercel@latest
          vercel alias set "https://${DEPLOY_URL}" paper-trail.vercel.app \
            --token "${VERCEL_TOKEN}" --scope mashincar

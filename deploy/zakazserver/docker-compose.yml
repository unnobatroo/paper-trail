name: paper-trail

x-runtime: &runtime
  restart: unless-stopped
  init: true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-application: &application
  <<: *runtime
  image: paper-trail-api:local
  build:
    context: ../..
    dockerfile: deploy/docker/api.Dockerfile
    target: api
  environment: &app-env
    APP_ENV: production
    DATABASE_URL: postgresql://paper_trail_api:${API_DB_PASSWORD:?required}@db:5432/paper_trail
    JOB_MODE: external
    PROCESS_ROLE: api
    REVIEW_KEY: ${REVIEW_KEY:?required}
    # every model runs on the host's goethe gateway, see goethe-phase.sh
    EMBED_MODEL: openai:Qwen/Qwen3-Embedding-0.6B
    EMBED_BASE_URL: https://goethe:8443/v1
    EMBED_API_KEY: ${GOETHE_API_KEY:?required}
    RERANKER: goethe
    RERANK_BASE_URL: https://goethe:8443/v1
    RERANK_API_KEY: ${GOETHE_API_KEY:?required}
    RERANK_MODEL: paper-trail/bge-reranker-v2-m3-bf16
    MODEL_CA_BUNDLE: /run/goethe/server.crt
    SEARCH_PROVIDER: searxng
    SEARXNG_URL: http://searxng:8080
    LLM_BASE_URL: https://goethe:8443/v1
    LLM_API_KEY: ${GOETHE_API_KEY:?required}
    LLM_MODEL: unnobatroo/paper-trail-qwen3-4b-instruct-hu-awq
    LLM_WINDOW: "1"
    LLM_CONCURRENCY: "4"
    RERANK_BATCH: "20"
    PARSER: docling
    PARSER_DEVICE: cpu
    NLP: huspacy
    # extra evidence domains, normally empty, sources live in official_sources
    ALLOWED_DOMAINS: ${ALLOWED_DOMAINS:-}
    API_ORIGINS: https://${DOMAIN:?required}
    MODEL_CACHE: /app/model-cache
    HF_HOME: /app/model-cache/huggingface
    XDG_CACHE_HOME: /app/model-cache
    DB: /app/data/paper_trail.db
    OMP_NUM_THREADS: "2"
    TOKENIZERS_PARALLELISM: "false"
  volumes:
    - documents:/app/data
    - model_cache:/app/model-cache
    - ${GOETHE_CERT:?path to goethe nginx/certs/server.crt}:/run/goethe/server.crt:ro
  extra_hosts:
    - goethe:host-gateway
  security_opt:
    - no-new-privileges:true
  cap_drop: [ALL]
  stop_grace_period: 45s

services:
  caddy:
    <<: *runtime
    build: ./caddy
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?required}
      DOMAIN: ${DOMAIN:?required}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
      frontend:
        condition: service_healthy
    mem_limit: 192m

  frontend:
    <<: *runtime
    build:
      context: ../../web
      dockerfile: ../deploy/docker/web.Dockerfile
    environment:
      API_URL: http://api:8000
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  api:
    <<: *application
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    mem_limit: 768m
    cpus: 2

  worker:
    <<: *application
    image: paper-trail-worker:local
    build:
      context: ../..
      dockerfile: deploy/docker/api.Dockerfile
      target: worker
      args:
        HUSPACY_MODEL_URL: ${HUSPACY_MODEL_URL:?copy .env.example for pinned HuSpaCy model}
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://paper_trail_worker:${WORKER_DB_PASSWORD:?required}@db:5432/paper_trail
      PROCESS_ROLE: worker
      REVIEW_KEY: ""
    command: [python, -m, paper_trail.worker]
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 4g
    cpus: 4

  migrate:
    <<: *application
    profiles: [tools]
    restart: "no"
    environment:
      <<: *app-env
      DATABASE_URL: postgresql://paper_trail:${DB_PASSWORD:?required}@db:5432/paper_trail
    command: [alembic, -c, db/alembic.ini, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  db:
    <<: *runtime
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: paper_trail
      POSTGRES_USER: paper_trail
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
      API_DB_PASSWORD: ${API_DB_PASSWORD:?required}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:?required}
    command:
      - postgres
      - -c
      - shared_buffers=512MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - effective_cache_size=1GB
      - -c
      - max_connections=30
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U paper_trail -d paper_trail"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 2g
    shm_size: 256m
    cpus: 2


  searxng:
    <<: *runtime
    image: searxng/searxng@sha256:dc2f7ed8a215b2f8244eaed083acdd50406f0de18bf43410cc460a4b511b7424
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:?required}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    mem_limit: 256m
    cpus: 1

  backup:
    <<: *runtime
    image: pgvector/pgvector:pg16
    environment:
      PGHOST: db
      PGUSER: paper_trail
      PGDATABASE: paper_trail
      PGPASSWORD: ${DB_PASSWORD:?required}
      BACKUP_RETENTION_DAYS: "7"
    entrypoint: [/bin/sh, /scripts/backup.sh]
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:?set an absolute backup directory}:/backups
      - documents:/documents:ro
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 256m

volumes:
  postgres_data:
  documents:
  model_cache:
  caddy_data:
  caddy_config:
